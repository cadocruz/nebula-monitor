# Tema âmbar, no estilo dos monitores de fósforo antigos.
# Uso: nebula-monitor --config examples/configs/amber-theme.toml
#
# Cada chave troca uma cor da paleta neon em toda a tela; as ausentes ficam como estão.

[theme]
background       = "#100b05" # fundo
text_primary     = "#ffd9a0" # texto principal
text_secondary   = "#9c7a4a" # rótulos e texto secundário
panel_border     = "#cc8a00" # molduras dos painéis
bar_track        = "#2a1d0c" # parte vazia das barras
primary_accent   = "#ffb000" # destaque principal
separator        = "#7a5200" # separadores
status_good      = "#ffcc66" # uso baixo, valores bons
status_warning   = "#fff3c4" # uso médio, moldura do painel focado
status_critical  = "#ff4d2e" # uso alto, alertas
secondary_accent = "#ff8c1a" # memória, gravação, envio
cache_usage      = "#d9a441" # cache

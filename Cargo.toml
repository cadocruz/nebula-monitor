[workspace]
members = ["nebula-core", "nebula-panels", "nebula-monitor", "examples/hello-panel"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Versões únicas para todo o workspace (plugins usam as mesmas via nebula-core)
[workspace.dependencies]
nebula-core = { path = "nebula-core" }
nebula-panels = { path = "nebula-panels" }
nebula-monitor = { path = "nebula-monitor" }
chrono = "0.4.45"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
crossterm = "0.29.0"
nvml-wrapper = "0.13.0"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.39.6"
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# unwind (não abort): um painel que entra em pânico é isolado e o monitor continua
panic = "unwind"
strip = true
